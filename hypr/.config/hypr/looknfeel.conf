# Change the default Omarchy look'n'feel

# https://wiki.hypr.land/Configuring/Basics/Variables/#general
general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2

    # Cyan active border
    col.active_border = rgba(22d3eeff)

    # Dark blue inactive border
    col.inactive_border = rgba(1e293bff)

    # Optional:
    # extend_border_grab_area = 15
}


# https://wiki.hypr.land/Configuring/Basics/Variables/#decoration
decoration {

    rounding = 14

    active_opacity = 1.0
    inactive_opacity = 0.95
    fullscreen_opacity = 1.0


    blur {
        enabled = true

        # Not too heavy
        size = 8
        passes = 3

        new_optimizations = true
    }


    # Slightly dim unfocused windows
    dim_inactive = true
    dim_strength = 0.05
}


# https://wiki.hypr.land/Configuring/Basics/Variables/#animations
animations {

    enabled = yes


    bezier = smooth, 0.25, 0.1, 0.25, 1.0
    bezier = easeOut, 0.16, 1, 0.3, 1


    animation = windows, 1, 4, smooth, slide
    animation = windowsOut, 1, 3, smooth, slide
    animation = border, 1, 8, default
    animation = fade, 1, 4, easeOut
    animation = workspaces, 1, 5, smooth, slidefade
}


# https://wiki.hypr.land/Configuring/Layouts/Variables/
layout {
    # Keep default
}


# https://wiki.hypr.land/Configuring/Layouts/Scrolling-Layout/
scrolling {
    # Keep default
}
